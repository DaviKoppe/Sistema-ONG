server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy to Django (compose service name: backend)
  location /api/ {
    proxy_pass https://sistema-ong-production.up.railway.app/api/;
    proxy_set_header Host sistema-ong-production.up.railway.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /media/ {
    proxy_pass https://sistema-ong-production.up.railway.app/media/;
    proxy_set_header Host sistema-ong-production.up.railway.app;
}
}

